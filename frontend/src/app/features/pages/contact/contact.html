<div class="min-h-screen bg-gray-50 py-12">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-bold text-gray-900 mb-8">Contacto</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Formulario -->
      <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold mb-6">Envíanos un mensaje</h2>
        <form (ngSubmit)="submitForm()" class="space-y-4">
          <input type="text" placeholder="Nombre" [(ngModel)]="contactForm.name" name="name" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"/>
          <input type="email" placeholder="Email" [(ngModel)]="contactForm.email" name="email" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"/>
          <input type="text" placeholder="Asunto" [(ngModel)]="contactForm.subject" name="subject" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"/>
          <textarea placeholder="Mensaje" rows="6" [(ngModel)]="contactForm.message" name="message" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
          <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">Enviar Mensaje</button>
        </form>
      </div>

      <!-- Info de Contacto -->
      <div class="space-y-6">
        <div class="bg-white rounded-lg shadow-sm p-6">
          <h3 class="font-semibold text-lg mb-4">Email</h3>
          <p class="text-gray-700">info@deepshop.com</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-6">
          <h3 class="font-semibold text-lg mb-4">Teléfono</h3>
          <p class="text-gray-700">+57 300 123 4567</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-6">
          <h3 class="font-semibold text-lg mb-4">Horario de Atención</h3>
          <p class="text-gray-700">Lunes a Viernes: 9:00 AM - 6:00 PM</p>
        </div>
      </div>
    </div>
  </div>
</div>
