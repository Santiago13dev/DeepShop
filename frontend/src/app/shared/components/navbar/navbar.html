<!-- Navbar Ultra Minimalista - PERMIAN Style -->
<nav class="navbar-minimal" [class.scrolled]="isScrolled()">
  
  <div class="nav-container">
    
    <!-- Logo simple -->
    <a routerLink="/" class="logo-minimal">
      <span class="logo-text-minimal">DEEPSHOP</span>
    </a>

    <!-- Menu Desktop -->
    <div class="nav-menu-minimal hidden lg:flex">
      <a routerLink="/shop" routerLinkActive="active" class="nav-link-minimal">TIENDA</a>
      <a routerLink="/categories" routerLinkActive="active" class="nav-link-minimal">CATEGORÍAS</a>
      <a routerLink="/offers" routerLinkActive="active" class="nav-link-minimal">OFERTAS</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link-minimal">CONTACTO</a>
    </div>

    <!-- Actions -->
    <div class="nav-actions">
      
      <a routerLink="/account/wishlist" class="nav-icon" aria-label="Wishlist">
        <svg class="icon-minimal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
        <span class="icon-badge" *ngIf="wishlistService.getWishlistCount() > 0">
          {{ wishlistService.getWishlistCount() }}
        </span>
      </a>

      <a routerLink="/cart" class="nav-icon" aria-label="Carrito">
        <svg class="icon-minimal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
        <span class="icon-badge" *ngIf="cartItemCount() > 0">
          {{ cartItemCount() }}
        </span>
      </a>

      <a routerLink="/account" class="nav-icon hidden md:flex" aria-label="Cuenta">
        <svg class="icon-minimal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </a>

      <!-- Mobile menu button -->
      <button 
        (click)="toggleMobileMenu()"
        class="nav-icon lg:hidden"
        aria-label="Menu">
        <svg *ngIf="!mobileMenuOpen()" class="icon-minimal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="mobileMenuOpen()" class="icon-minimal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu-minimal lg:hidden" [class.open]="mobileMenuOpen()">
    <a routerLink="/shop" (click)="closeMobileMenu()" class="mobile-link-minimal">TIENDA</a>
    <a routerLink="/categories" (click)="closeMobileMenu()" class="mobile-link-minimal">CATEGORÍAS</a>
    <a routerLink="/offers" (click)="closeMobileMenu()" class="mobile-link-minimal">OFERTAS</a>
    <a routerLink="/contact" (click)="closeMobileMenu()" class="mobile-link-minimal">CONTACTO</a>
    <a routerLink="/account" (click)="closeMobileMenu()" class="mobile-link-minimal md:hidden">MI CUENTA</a>
  </div>
</nav>
