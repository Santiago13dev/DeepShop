<!-- Navbar Principal -->
<nav class="bg-white shadow-sm sticky top-0 z-50">
  <!-- Container Principal -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/" class="flex items-center space-x-2">
          <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-2 rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
          </div>
          <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
            Deepshop
          </span>
        </a>
      </div>

      <!-- Navegación Desktop -->
      <div class="hidden md:flex md:items-center md:space-x-8">
        <a routerLink="/" routerLinkActive="text-indigo-600" [routerLinkActiveOptions]="{exact: true}" 
           class="text-gray-700 hover:text-indigo-600 transition-colors duration-200 font-medium">
          Inicio
        </a>
        <a routerLink="/catalog" routerLinkActive="text-indigo-600" 
           class="text-gray-700 hover:text-indigo-600 transition-colors duration-200 font-medium">
          Productos
        </a>
        <a routerLink="/categories" routerLinkActive="text-indigo-600" 
           class="text-gray-700 hover:text-indigo-600 transition-colors duration-200 font-medium">
          Categorías
        </a>
        <a routerLink="/offers" routerLinkActive="text-indigo-600" 
           class="text-gray-700 hover:text-indigo-600 transition-colors duration-200 font-medium">
          Ofertas
        </a>
      </div>

      <!-- Barra de búsqueda (Desktop) -->
      <div class="hidden md:block flex-1 max-w-md mx-8">
        <app-search-bar />
      </div>

      <!-- Iconos de acción -->
      <div class="flex items-center space-x-4">
        <!-- Favoritos -->
        <a routerLink="/account/wishlist" class="relative text-gray-700 hover:text-indigo-600 transition-colors duration-200 hidden md:block">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
          @if (wishlistService.count() > 0) {
            <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">
              {{ wishlistService.count() }}
            </span>
          }
        </a>

        <!-- Usuario -->
        <a routerLink="/account" class="text-gray-700 hover:text-indigo-600 transition-colors duration-200 hidden md:block">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </a>

        <!-- Carrito -->
        <a routerLink="/cart" class="relative text-gray-700 hover:text-indigo-600 transition-colors duration-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          @if (cartService.count() > 0) {
            <span class="absolute -top-2 -right-2 bg-indigo-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">
              {{ cartService.count() }}
            </span>
          }
        </a>

        <!-- Botón menú móvil -->
        <button (click)="toggleMobileMenu()" class="md:hidden text-gray-700 hover:text-indigo-600 transition-colors duration-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @if (!mobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Menú Móvil -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden border-t border-gray-200 bg-white">
      <div class="px-4 pt-2 pb-3 space-y-1">
        <!-- Barra de búsqueda móvil -->
        <div class="mb-3">
          <app-search-bar />
        </div>
        
        <a routerLink="/" (click)="toggleMobileMenu()" 
           class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50 transition-colors duration-200">
          Inicio
        </a>
        <a routerLink="/catalog" (click)="toggleMobileMenu()" 
           class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50 transition-colors duration-200">
          Productos
        </a>
        <a routerLink="/categories" (click)="toggleMobileMenu()" 
           class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50 transition-colors duration-200">
          Categorías
        </a>
        <a routerLink="/offers" (click)="toggleMobileMenu()" 
           class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50 transition-colors duration-200">
          Ofertas
        </a>
        <a routerLink="/account" (click)="toggleMobileMenu()" 
           class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50 transition-colors duration-200">
          Mi Cuenta
        </a>
      </div>
    </div>
  }
</nav>
