<!-- Barra de Búsqueda -->
<div class="relative">
  <div class="relative">
    <input
      type="text"
      placeholder="Buscar productos..."
      [value]="searchQuery()"
      (input)="onSearch($event)"
      class="w-full px-4 py-2 pl-10 pr-4 text-gray-700 bg-gray-100 border-0 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all duration-200"
    />
    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
  </div>

  <!-- Sugerencias -->
  @if (showSuggestions() && searchQuery().length > 0) {
    <div class="absolute top-full mt-2 w-full bg-white rounded-lg shadow-lg border border-gray-200 z-50">
      <ul class="py-2">
        @for (suggestion of suggestions; track suggestion) {
          @if (suggestion.toLowerCase().includes(searchQuery().toLowerCase())) {
            <li>
              <button
                (click)="selectSuggestion(suggestion)"
                class="w-full text-left px-4 py-2 hover:bg-gray-50 transition-colors duration-150 flex items-center space-x-2"
              >
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="text-gray-700">{{ suggestion }}</span>
              </button>
            </li>
          }
        }
      </ul>
    </div>
  }
</div>
